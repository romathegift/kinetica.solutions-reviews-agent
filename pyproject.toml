[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviews-agent"
version = "0.1.0"
description = "Kinetica Solutions — LangGraph review-response agent with human-in-the-loop Telegram gate"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.0",
    "anthropic==0.116.0",
    "fastembed==0.8.0",
    "psycopg[binary,pool]==3.3.4",
    "pgvector==0.5.0",
    "fastapi[standard]==0.139.0",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
packages = ["reviews_agent", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]