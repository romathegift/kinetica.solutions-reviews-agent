# ==========================================================================
# Reviews Agent — вебхук-сервис HITL-гейта.
#
# Сеть n8n_default объявлена external: её создал compose-проект n8n, и
# владеть ею мы не должны. Postgres доступен в ней под алиасом postgres,
# поэтому SSH-туннель, который нужен при локальной разработке, здесь не
# нужен вовсе — контейнер ходит в базу напрямую по внутренней сети.
# ==========================================================================

services:
  reviews-agent:
    build: .
    image: reviews-agent:latest
    container_name: reviews-agent
    restart: unless-stopped

    # Конфигурация приходит НАСТОЯЩИМИ переменными окружения.
    # Монтировать .env внутрь контейнера нельзя: config.py вычисляет путь
    # к нему от расположения модуля, а после pip install модуль лежит в
    # site-packages — файл там никто не найдёт, и pydantic-settings
    # промолчит, потому что отсутствующий env_file для него не ошибка.
    env_file:
      - .env

    # ТОЛЬКО loopback. Без префикса 127.0.0.1 docker пишет правило в
    # iptables в обход UFW, и порт оказывается открыт в интернет — а за
    # ним эндпоинт, который мы намеренно спрятали за nginx.
    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - n8n_default

    # /health не трогает базу — это проверка процесса, а не стека.
    # Именно поэтому она не покраснеет при недоступном Postgres:
    # там ретраи и уведомление оператора, перезапуск ничего не починит.
    # curl в python:3.11-slim нет, поэтому пробуем средствами python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Пауза HITL может длиться днями, но обработка одного отзыва —
    # это поход в две модели и в базу. 30 секунд дают ей завершиться
    # при рестарте; всё равно состояние лежит в чекпоинте Postgres.
    stop_grace_period: 30s

    # Без ротации docker logs растут неограниченно и однажды съедят диск.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  n8n_default:
    external: true